<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chess Coaching Platform</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="navbar__container">
            <a href="index.html" id="navbar__logo">Chess Coaching Platform</a>
            <div class="navbar__toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="navbar__menu">
                <li class="navbar__item">
                    <a href="index.html" class="navbar__links">Home</a>
                </li>
                <li class="navbar__item">
                    <a href="coaches.html" class="navbar__links">Coaches</a>
                </li>

                <li class="navbar__item">
                    <a href="register.html" class="navbar__links">Register</a>
                </li>
                <li class="navbar__btn">
                    <a href="login.html" class="button active">Login</a>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="login-section">
            <div class="chess-pattern"></div>
            <div class="login__container">
                <div class="login-card">
                    <div class="login-tabs">
                        <button class="tab-button active" data-tab="student">Student Login</button>
                        <button class="tab-button" data-tab="coach">Coach Login</button>
                    </div>

                    <!-- Student Login Form -->
                    <form id="student-login-form" class="login-form active">
                        <h1>Student Login</h1>
                        <div class="form-group">
                            <label for="student-username">Username</label>
                            <input type="text" id="student-username" name="username" autocomplete="off" required>
                        </div>
                        <div class="form-group">
                            <label for="student-password">Password</label>
                            <input type="password" id="student-password" name="password" autocomplete="current-password" required>
                        </div>
                        <div id="student-login-error" class="error-message"></div>
                        <button type="submit" class="cta-button primary">Login as Student</button>
                    </form>

                    <!-- Coach Login Form -->
                    <form id="coach-login-form" class="login-form">
                        <h1>Coach Login</h1>
                        <div class="form-group">
                            <label for="coach-username">Username</label>
                            <input type="text" id="coach-username" name="username" autocomplete="off" required>
                        </div>
                        <div class="form-group">
                            <label for="coach-password">Password</label>
                            <input type="password" id="coach-password" name="password" autocomplete="current-password" required>
                        </div>
                        <div class="form-group" id="expertise-group" style="display: none;">
                            <label for="coach-expertise">Expertise</label>
                            <select id="coach-expertise" name="expertise">
                                <option value="">Select your expertise</option>
                                <option value="Opening Preparation">Opening Preparation</option>
                                <option value="Middle Game Strategy">Middle Game Strategy</option>
                                <option value="Endgame Technique">Endgame Technique</option>
                                <option value="Tactics and Calculation">Tactics and Calculation</option>
                                <option value="Tournament Preparation">Tournament Preparation</option>
                            </select>
                        </div>
                        <div id="coach-login-error" class="error-message"></div>
                        <button type="submit" class="cta-button primary">Login as Coach</button>
                    </form>

                    <p class="register-link" id="register-link">Don't have an account? <a href="register.html">Register here</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__container">
            <p>&copy; 2024 Chess Coaching Platform. All rights reserved.</p>
        </div>
    </footer>

    <script src="api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Tab switching functionality
            const tabs = document.querySelectorAll('.tab-button');
            const forms = document.querySelectorAll('.login-form');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    forms.forEach(f => f.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(`${tab.dataset.tab}-login-form`).classList.add('active');
                });
            });

            // ── Coach login ──────────────────────────────────────────────────
            document.getElementById('coach-login-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('coach-username').value.trim();
                const password = document.getElementById('coach-password').value;
                const errorDiv = document.getElementById('coach-login-error');
                errorDiv.style.display = 'none';

                try {
                    const user = await Api.login(username, password);
                    if (user.role !== 'coach') {
                        errorDiv.textContent = 'This account is not a coach account.';
                        errorDiv.style.display = 'block';
                        Api.clearSession();
                        return;
                    }
                    window.location.href = 'coach-dashboard.html';
                } catch (err) {
                    errorDiv.textContent = err.message || 'Invalid username or password';
                    errorDiv.style.display = 'block';
                }
            });

            // ── Student login ─────────────────────────────────────────────────
            document.getElementById('student-login-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('student-username').value.trim();
                const password = document.getElementById('student-password').value;
                const errorDiv = document.getElementById('student-login-error');
                errorDiv.style.display = 'none';

                try {
                    const user = await Api.login(username, password);
                    if (user.role !== 'student') {
                        errorDiv.textContent = 'This account is not a student account.';
                        errorDiv.style.display = 'block';
                        Api.clearSession();
                        return;
                    }
                    window.location.href = 'student-dashboard.html';
                } catch (err) {
                    errorDiv.textContent = err.message || 'Invalid username or password';
                    errorDiv.style.display = 'block';
                }
            });

        });
    </script>
</body>
</html>
